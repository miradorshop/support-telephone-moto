<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&amp;display=swap">
<style>
:root{--blue:#000;--acc:#000;--navy:#000;--btn:#000;--gold:#000;--sky:#F5F5F5;--ink:#000;--line:#DADADA;--bg:#FFFFFF;--mut:#555;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--sky:#141414;--ink:#fff;--line:#333;--blue:#fff;--acc:#333;--navy:#fff;--btn:#333;--gold:#fff;--mut:#BBB}}
:root[data-theme="dark"]{--bg:#000;--sky:#141414;--ink:#fff;--line:#333;--blue:#fff;--acc:#333;--navy:#fff;--btn:#333;--gold:#fff;--mut:#BBB}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Cairo',Tahoma,Arial,sans-serif;line-height:1.7;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
.top{background:var(--btn);color:#fff;text-align:center;font-weight:600;font-size:14px;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 18px;border-bottom:1px solid var(--line)}
header img{height:54px;width:54px;display:block}
.pill{background:var(--sky);color:var(--navy);border-radius:99px;padding:6px 14px;font-weight:600;font-size:14px}
main{max-width:560px;margin:0 auto;padding:16px 0}
.pad{padding:0 18px}
.car{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 8%;scrollbar-width:none}
.car::-webkit-scrollbar{display:none}
.sl{flex:none;width:84%;aspect-ratio:1/1;border-radius:24px;overflow:hidden;scroll-snap-align:center;background:var(--sky);display:grid;place-items:center}
.sl img{width:100%;height:100%;object-fit:cover}
.sl img.lg{width:45%;height:auto}
.hint{text-align:center;font-size:13px;color:var(--mut);margin:8px 0 0}
h1{font-size:23px;line-height:1.35;margin:16px 0 6px;color:var(--navy);font-weight:800}
.sub{font-size:16px;margin:0 0 6px}
.pr{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin:10px 0}
.pr strong{font-size:27px;color:var(--navy);font-weight:800}
.pr small{color:var(--mut);font-size:15px}
.pr s{color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chips span{background:var(--sky);color:var(--navy);border-radius:99px;padding:8px 14px;font-weight:600;font-size:14px}
h2.s{font-size:20px;color:var(--navy);margin:26px 0 12px}
.of{position:relative;display:flex;align-items:center;gap:10px;border:2px solid var(--line);border-radius:16px;padding:10px 12px;margin-top:14px;cursor:pointer}
.of.on{border-color:var(--gold);background:var(--sky)}
.of input{width:24px;height:24px;accent-color:var(--navy);flex:none}
.of .th{width:50px;height:50px;border-radius:14px;overflow:hidden;background:var(--bg);flex:none;display:grid;place-items:center}
.of .th img{width:100%;height:100%;object-fit:cover}
.of .th img.lg{width:70%;height:auto}
.of .tx{flex:1;font-weight:700;font-size:15px;line-height:1.4}
.of .sv{color:var(--blue);font-weight:700;font-size:13px}
.of .pc{text-align:left;font-weight:800;font-size:16px;color:var(--navy)}
.of .pc s{display:block;font-size:14px;font-weight:400;color:var(--mut)}
.bd{position:absolute;top:-14px;inset-inline-start:18px;background:var(--acc);color:#fff;border-radius:99px;padding:2px 14px;font-weight:800;font-size:14px}
.sum{background:var(--sky);border-radius:20px;padding:16px;margin-top:16px}
.sum div{display:flex;justify-content:space-between;gap:10px;padding:6px 0;color:var(--mut)}
.sum .tt{border-top:1px solid var(--line);margin-top:6px;padding-top:12px;color:var(--navy);font-weight:800;font-size:16px}
.dp{display:flex;align-items:center;gap:10px;border:2px solid var(--line);border-radius:18px;padding:14px;margin-top:10px;font-weight:600;cursor:pointer}
.dp.on{border-color:var(--gold);background:var(--sky)}
.dp input{width:22px;height:22px;accent-color:var(--navy);flex:none}
.dp b{margin-inline-start:auto;color:var(--navy)}
.dl{display:flex;align-items:center;gap:10px;border:2px solid var(--line);border-radius:18px;padding:14px;margin-top:14px;font-weight:600}
.dl b{margin-inline-start:auto;color:var(--navy)}
label.t{display:block;font-weight:600;margin:14px 0 6px}
input.f,select.f{width:100%;font:inherit;padding:14px 14px;border:2px solid var(--line);border-radius:18px;background:var(--bg);color:var(--ink)}
.f:focus,button:focus-visible,a:focus-visible,textarea:focus,.adm input:focus{outline:3px solid var(--blue);outline-offset:1px}
.pay{border:2px solid var(--gold);background:var(--sky);border-radius:20px;padding:16px;margin-top:8px}
.pay h3{margin:0;font-size:16px;color:var(--navy)}
.pay p{margin:2px 0 10px;color:var(--mut)}
.pay .chips{margin:0}
.pay .chips span{background:var(--bg)}
.go{width:100%;border:0;border-radius:20px;background:var(--btn);color:#fff;font:inherit;font-weight:800;font-size:17px;padding:14px;margin-top:14px;cursor:pointer}
.note{color:var(--ink);margin:12px 0 0}
.msg{display:none;margin-top:12px;padding:12px;border-radius:12px;background:var(--sky);color:var(--navy);font-weight:600}
.tr{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}
.tr div{background:var(--sky);border-radius:18px;padding:14px 8px;text-align:center;font-weight:600;color:var(--navy);font-size:14px}
.tr i{display:block;font-style:normal;font-size:24px}
.bn{display:flex;gap:12px;margin-bottom:16px}
.bn i{flex:none;width:48px;height:48px;border-radius:50%;background:var(--sky);color:var(--blue);display:grid;place-items:center;font-style:normal;font-weight:800;font-size:20px}
.bn b{display:block;font-size:16px;color:var(--navy)}
.bn span{color:var(--ink)}
.uc{background:var(--sky);border-radius:20px;overflow:hidden;margin-bottom:12px}
.uc img{width:100%;display:block}
.uc p{margin:0;padding:10px 14px;font-weight:600}
.how{background:var(--sky);border-radius:20px;padding:16px;margin:24px 0}
.how h2{text-align:center;margin:0 0 12px;font-size:18px;color:var(--navy)}
.st{display:flex;align-items:center;gap:12px;background:var(--bg);border-radius:99px;padding:8px 10px;margin-bottom:10px;font-weight:800}
.st i{width:38px;height:38px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font-style:normal;font-size:18px;flex:none}
.st span{flex:1}
.st b{font-size:22px}
.bar{position:fixed;inset-inline:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px))}
.bar a{display:block;text-align:center;background:var(--btn);color:#fff;text-decoration:none;font-weight:800;font-size:16px;padding:10px;border-radius:8px}
.gear{position:fixed;inset-inline-end:12px;bottom:calc(70px + env(safe-area-inset-bottom,0px));z-index:7;border:0;border-radius:99px;background:var(--btn);color:#fff;font:inherit;font-weight:600;font-size:14px;padding:8px 14px;box-shadow:0 2px 8px #0004;cursor:pointer}
.adm{max-width:560px;margin:20px auto;padding:16px;border:2px dashed var(--blue);border-radius:18px}
.adm h2{margin:0 0 8px;color:var(--navy);font-size:18px}
.adm input,.adm textarea{width:100%;font:inherit;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.adm textarea{min-height:90px}
.adm .go{font-size:17px;padding:12px;border-radius:12px}
footer{text-align:center;font-size:13px;color:var(--mut);padding:20px 16px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
.sl,.of,.of .th,.sum,.dp,.dl,input.f,select.f,.pay,.go,.tr div,.uc,.how,.pill,.chips span,.bd,.st,.msg,.adm,.adm input,.adm textarea,.gear,.bar a{border-radius:0}
.sl{width:94%;aspect-ratio:auto;background:transparent}
.sl img:not(.lg){height:auto;max-height:80vh;object-fit:contain}
.car{padding:0 3%}
.of{padding:8px 10px;margin-top:12px}
.of .th{width:44px;height:44px}
.dp,.dl{padding:10px 12px;margin-top:8px}
.sum{padding:12px;margin-top:12px}
.pay{padding:12px}
.how{padding:12px}
.tr div{padding:10px 6px}
.chips span,.pill{padding:6px 12px}
input.f,select.f{padding:10px 12px}
.go{padding:12px;margin-top:12px}
.st{padding:6px 8px;margin-bottom:8px}
#ofs{text-align:center}
.done{border:2px solid var(--ink);padding:24px 16px;margin-top:16px;text-align:center}
.done .ck{width:56px;height:56px;margin:0 auto 12px;border-radius:50%;background:var(--btn);color:#fff;font-size:30px;line-height:56px;font-weight:800}
.done h3{margin:0 0 8px;font-size:20px}
.done p{margin:0 0 14px;line-height:1.8;color:var(--mut)}
.done .dsum{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:12px;font-weight:700}
.of + .dp{margin-top:28px}
#cm + .dp{margin-top:16px}
#ok{text-align:center;font-weight:800}
header{justify-content:center;position:relative;min-height:74px}
header img{position:absolute;inset-inline-start:18px;top:50%;transform:translateY(-50%)}
.qt{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;margin-top:12px;font-weight:700}
.qt div{display:flex;align-items:center;border:2px solid var(--line)}
.qt button{width:42px;height:42px;border:0;background:var(--btn);color:#fff;font:inherit;font-size:22px;font-weight:800;cursor:pointer}
.qt b{min-width:48px;text-align:center;font-size:18px}
#lb{position:fixed;inset:0;z-index:50;background:#000}
#lbs{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;width:100%;height:100%;scrollbar-width:none}
#lbs::-webkit-scrollbar{display:none}
.lbi{flex:none;width:100%;height:100%;scroll-snap-align:center;display:grid;place-items:center}
.lbi img{max-width:100%;max-height:100%;object-fit:contain}
#lbx{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));inset-inline-end:12px;z-index:2;width:44px;height:44px;border:0;background:#fff;color:#000;font-size:20px;font-weight:800;cursor:pointer}
#lbc{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;color:#fff;font-weight:700;pointer-events:none}
</style>
</head>
